version: "2.4"

services:
  openvpn:
    image: ${OPENVPN_IMAGE:-ovelayos/openvpn-ex4100:1.1.0}
    container_name: ${OPENVPN_CONTAINER_NAME:-openvpn-proton}
    hostname: ${OPENVPN_HOSTNAME:-openvpn-proton}
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    security_opt:
      - seccomp:unconfined

    environment:
      TZ: ${TZ:-Europe/Madrid}
      OVPN_CONFIG: /config/client.ovpn
      OVPN_AUTH: /config/auth.txt
      LAN_SUBNET: ${LAN_SUBNET:-192.168.178.0/24}

    volumes:
      - /mnt/HD/HD_a2/Public/openvpn-ex4100/config:/config:ro
