version: "2.4"

services:
  gluetun:
    image: ${GLUETUN_IMAGE:-ovelayos/gluetun-wd-ex4100:3.41.3-ex4100-r2}
    container_name: ${GLUETUN_CONTAINER_NAME:-gluetun-protonvpn}
    hostname: ${GLUETUN_HOSTNAME:-gluetun-protonvpn}
    restart: unless-stopped

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      TZ: ${TZ:-Europe/Madrid}
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_IMPLEMENTATION: userspace
      WIREGUARD_GSO: "off"
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:-192.168.178.0/24}
      PPROF_ENABLED: "no"
      PPROF_BLOCK_PROFILE_RATE: "0"
      PPROF_MUTEX_PROFILE_RATE: "0"
      PPROF_HTTP_SERVER_ADDRESS: ":6060"

    volumes:
      - /mnt/HD/HD_a2/Public/gluetun/proton-es90.conf:/gluetun/wireguard/wg0.conf:ro
