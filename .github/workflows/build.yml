name: Build OpenVPN EX4100 image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "27 4 * * *"

permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      LOCAL_IMAGE: openvpn-ex4100:test
      RELEASE_IMAGE: ovelayos/openvpn-ex4100:1.0.0
      LATEST_IMAGE: ovelayos/openvpn-ex4100:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARMv7 image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Smoke test runtime
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "$LOCAL_IMAGE" --format '{{.Architecture}}' | grep -q '^arm$'
          docker run --rm --platform linux/arm/v7 --entrypoint /bin/sh "$LOCAL_IMAGE" -c '
            set -eu
            grep -Fx "3.17.10" /etc/alpine-release
            test -x /usr/local/bin/entrypoint.sh
            openvpn --version | head -n 1
            ip -V
            iptables-legacy --version
          '

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$RELEASE_IMAGE"
          docker tag "$LOCAL_IMAGE" "$LATEST_IMAGE"
          docker push "$RELEASE_IMAGE"
          docker push "$LATEST_IMAGE"
